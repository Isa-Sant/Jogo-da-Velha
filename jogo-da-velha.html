<!DOCTYPE html>
<html lang="pt-br">
<head>

<!-- Define caracteres especiais (acentos etc) -->
<meta charset="UTF-8">

<!-- Faz o site adaptar para celular -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Nome que aparece na aba do navegador -->
<title>Jogo da Velha PRO</title>

<!-- Conecta arquivo CSS -->
<link rel="stylesheet" href="jogo-da-velha.css">

</head>

<body>

<!-- Título principal do jogo -->
<h1>🔥 Jogo da Velha PRO</h1>

<!-- Texto dinâmico controlado pelo JavaScript -->
<!-- Aqui aparece: vez do jogador, vitória ou empate -->
<h2 id="status">Sua vez (X)</h2>

<!-- Placar salvo com localStorage -->
<p>Vitórias: <span id="wins">0</span></p>

<!-- TABULEIRO -->
<!-- container grid que segura as casas -->
<div class="board">

<!-- Cada casa é uma célula -->
<!-- data-index indica posição dentro do array JS -->
<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>

<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>

<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>

</div>

<!-- Botão chama função restartGame() do JS -->
<button onclick="restartGame()">Reiniciar</button>

<!-- Conecta JavaScript -->
<script src="jogo-da-velha.js"></script>

</body>
</html>
